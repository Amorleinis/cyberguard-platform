services:
  db:
    image: postgres:15-alpine
    container_name: cyberguard-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-backend-api
    restart: unless-stopped
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cyberguard:cyberguard@db:5432/cyberguard}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      ALEMBIC_CONFIG: /app/backend/alembic.ini
      APP_MODULE: ${APP_MODULE:-app.main:app}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
