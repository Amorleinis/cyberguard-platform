name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install black flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 spectra_phoenix_producer

      - name: Format check with black
        run: |
          black --check spectra_phoenix_producer

      - name: Run tests
        run: |
          pytest tests/

      - name: Validate event schemas
        run: |
          python -c "
import spectra_phoenix_producer.schemas as schemas
for etype, model in schemas.EVENT_MODEL_MAP.items():
    print(f'Validating {etype} model schema...')
    dummy = model.schema()
"
