apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spectra-guardian-dashboard
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: spectra-dashboard-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  tls:
  - hosts:
    - your.domain.com
    secretName: spectra-dashboard-tls
  rules:
  - host: your.domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spectra-guardian-dashboard
            port:
              number: 8501
